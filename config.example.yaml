# SignalBloom agent config. Copy this file to config.yaml and fill it in.
# config.yaml will hold your site token, so never commit it (it is in .gitignore).
# See docs/API.md for the contract these values come from.

# Base HTTPS address of the SignalBloom cloud app, without /api on the end.
cloud_url: https://your-cloud-run-url.a.run.app

# One-time setup code shown in Account & Settings when an Admin creates a site.
# Codes work once and expire after 24 hours.
setup_code: SB-XXXX-XXXX

# Leave these blank. The agent fills them in after it registers.
site_id:
site_token:

# How often to send readings and check for approved fixes (seconds).
interval_seconds: 30

# How often to run the bandwidth test (seconds). 900 = 15 minutes.
bandwidth_interval_seconds: 900

# Size of the file downloaded for the bandwidth test (megabytes, up to 500).
# Bigger is more accurate on fast links but uses more data: 25 MB every
# 15 minutes is about 2.4 GB a day.
bandwidth_test_mb: 25

# How often to run a full scan for devices on the network (seconds).
device_scan_seconds: 300

# How often to recheck devices already found, between full scans (seconds).
device_recheck_seconds: 20

# Where the agent keeps readings it could not send yet.
data_dir: ./data

# Your router's address. Leave blank to find it automatically (default gateway).
router_address:

# A reliable address on the internet, used for latency, packet loss and uptime.
public_address: 1.1.1.1
